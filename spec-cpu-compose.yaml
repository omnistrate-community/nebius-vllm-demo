version: "3"
x-postgres-exporter-sidecar: &postgresExporterSidecar
  postgres-exporter:
    imageNameWithTag: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
    resourceLimits:
      cpu: "250m"
      memory: "256Mi"
    ports:
      - containerPort: 9187

