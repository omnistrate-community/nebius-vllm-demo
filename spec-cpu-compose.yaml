    scrapeTargets: *postgresNativeScrapeTargets
    additionalMetrics: *postgresNativeAdditionalMetrics

services:
  Writer:
    image: postgres:16-bookworm
    command:
      - /bin/bash
      - -ec
      - |
          set -euo pipefail

          HBA_FILE="/var/lib/postgresql/data/pg_hba.custom.conf"
          cat > "${HBA_FILE}" <<'EOF'
          local   all             all                                     trust
          host    all             all             127.0.0.1/32            scram-sha-256
          host    all             all             ::1/128                 scram-sha-256
          local   replication     all                                     trust
          host    replication     all             127.0.0.1/32            scram-sha-256
          host    replication     all             ::1/128                 scram-sha-256
          host    all             all             all                     scram-sha-256
          host    replication     omnistrate_replication all             scram-sha-256
          EOF

          exec /usr/local/bin/docker-entrypoint.sh postgres \
            -c hba_file="${HBA_FILE}" \
            -c listen_addresses='*' \
            -c wal_level=replica \
            -c hot_standby=on \
            -c max_wal_senders=10 \
            -c max_replication_slots=10 \
            -c wal_keep_size=1024 \
            -c log_hostname=on \
            -c password_encryption=scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - source: ./writer-data
        target: /var/lib/postgresql/data
        type: bind
    x-omnistrate-compute:
      instanceTypes:
        - name: 2vcpu-8gb
          cloudProvider: nebius
          platform: cpu-e2
    x-omnistrate-capabilities:
      sidecars: *postgresExporterSidecar
    environment:
      - POSTGRES_PASSWORD=$var.postgresqlPassword
      - POSTGRES_DB=$var.postgresqlDatabase
      - POSTGRES_USER=$var.postgresqlUsername
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
      - PGDATA=/var/lib/postgresql/data/pgdata
      - DATA_SOURCE_URI=127.0.0.1:5432/postgres?sslmode=disable
      - DATA_SOURCE_USER=$var.postgresqlUsername
      - DATA_SOURCE_PASS=$var.postgresqlPassword
    x-omnistrate-actionhooks:
      - image: postgres:16-bookworm
        scope: NODE
        type: HEALTH_CHECK
        command:
          - /bin/bash
          - -ec
        commandTemplate: |
          #!/bin/bash
          set -euo pipefail

          nc -z -w 5 127.0.0.1 5432
      - image: postgres:16-bookworm
        scope: CLUSTER
        type: INIT
        command:
          - /bin/bash
          - -ec
        commandTemplate: |
          #!/bin/bash
          set -euo pipefail

          WRITER_HOST="${FIRST_NODE_LOCAL_NAME:-writer}"
          export PGPASSWORD="{{ $var.postgresqlPassword }}"

          until pg_isready -h "${WRITER_HOST}" -p 5432 -U "{{ $var.postgresqlUsername }}" -d postgres; do
            sleep 5
          done

          if psql -h "${WRITER_HOST}" -U "{{ $var.postgresqlUsername }}" -d postgres -tAc \
            "SELECT 1 FROM pg_roles WHERE rolname = 'omnistrate_replication'" | grep -q 1
          then
            psql -v ON_ERROR_STOP=1 -h "${WRITER_HOST}" -U "{{ $var.postgresqlUsername }}" -d postgres \
              -c "ALTER ROLE omnistrate_replication WITH REPLICATION LOGIN PASSWORD '{{ $sys.deterministicSeedValue }}';"
          else
            psql -v ON_ERROR_STOP=1 -h "${WRITER_HOST}" -U "{{ $var.postgresqlUsername }}" -d postgres \
              -c "CREATE ROLE omnistrate_replication WITH REPLICATION LOGIN PASSWORD '{{ $sys.deterministicSeedValue }}';"
          fi
      - image: postgres:16-bookworm
        scope: CLUSTER
        type: PRE_UPGRADE
        command:
          - /bin/bash
          - -ec
        commandTemplate: |
          #!/bin/bash
          set -euo pipefail

          WRITER_HOST="${FIRST_NODE_LOCAL_NAME:-writer}"
          export PGPASSWORD="{{ $var.postgresqlPassword }}"

          until pg_isready -h "${WRITER_HOST}" -p 5432 -U "{{ $var.postgresqlUsername }}" -d postgres; do
            sleep 5
          done

          psql -v ON_ERROR_STOP=1 -h "${WRITER_HOST}" -U "{{ $var.postgresqlUsername }}" -d postgres -c "CHECKPOINT;"
          psql -v ON_ERROR_STOP=1 -h "${WRITER_HOST}" -U "{{ $var.postgresqlUsername }}" -d postgres -c "SELECT pg_switch_wal();"
      - image: postgres:16-bookworm
        scope: CLUSTER
        type: POST_UPGRADE
        command:
          - /bin/bash
          - -ec
        commandTemplate: |
          #!/bin/bash
          set -euo pipefail

          WRITER_HOST="${FIRST_NODE_LOCAL_NAME:-writer}"
          export PGPASSWORD="{{ $var.postgresqlPassword }}"

          until pg_isready -h "${WRITER_HOST}" -p 5432 -U "{{ $var.postgresqlUsername }}" -d postgres; do
            sleep 5
          done

          if psql -h "${WRITER_HOST}" -U "{{ $var.postgresqlUsername }}" -d postgres -tAc \
            "SELECT 1 FROM pg_roles WHERE rolname = 'omnistrate_replication'" | grep -q 1
          then
            psql -v ON_ERROR_STOP=1 -h "${WRITER_HOST}" -U "{{ $var.postgresqlUsername }}" -d postgres \
              -c "ALTER ROLE omnistrate_replication WITH REPLICATION LOGIN PASSWORD '{{ $sys.deterministicSeedValue }}';"
          else
            psql -v ON_ERROR_STOP=1 -h "${WRITER_HOST}" -U "{{ $var.postgresqlUsername }}" -d postgres \
              -c "CREATE ROLE omnistrate_replication WITH REPLICATION LOGIN PASSWORD '{{ $sys.deterministicSeedValue }}';"
          fi
    x-omnistrate-api-params:
      - key: postgresqlPassword
        description: Default DB Password
        name: Password
        type: Password
        modifiable: false
        required: true
        export: true
      - key: postgresqlDatabase
        description: Default DB Name
        name: Default Database
        type: String
        modifiable: false
        required: true
        export: true
      - key: postgresqlUsername
        description: Username
        name: Default DB Username
        type: String
        modifiable: false
        required: true
        export: true
    x-omnistrate-mode-internal: true

  Reader:
    image: postgres:16-bookworm
    command:
      - /bin/bash
      - -ec
      - |
          set -euo pipefail

          if [ ! -s "${PGDATA}/PG_VERSION" ]; then
            echo "Replica data directory has not been initialized"
            exit 1
          fi

          exec /usr/local/bin/docker-entrypoint.sh postgres \
            -c listen_addresses='*' \
            -c hot_standby=on \
            -c log_hostname=on
    ports:
      - "5433:5432"
    volumes:
      - source: ./reader-data
        target: /var/lib/postgresql/data
        type: bind
    x-omnistrate-compute:
      replicaCountAPIParam: numReplicas
      instanceTypes:
        - name: 2vcpu-8gb
          cloudProvider: nebius
          platform: cpu-e2
    x-omnistrate-capabilities:
      sidecars: *postgresExporterSidecar
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - DATA_SOURCE_URI=127.0.0.1:5432/postgres?sslmode=disable
      - DATA_SOURCE_USER=$var.postgresqlUsername
      - DATA_SOURCE_PASS=$var.postgresqlPassword
    x-omnistrate-actionhooks:
      - image: postgres:16-bookworm
        scope: NODE
        type: HEALTH_CHECK
        command:
          - /bin/bash
          - -ec
        commandTemplate: |
          #!/bin/bash
          set -euo pipefail

          nc -z -w 5 127.0.0.1 5432
      - image: postgres:16-bookworm
        scope: NODE
        type: INIT
        command:
          - /bin/bash
          - -ec
        commandTemplate: |
          #!/bin/bash
          set -euo pipefail

          SLOT_NAME="reader_$((NODE_INDEX + 1))"

          if [ -s "${PGDATA}/PG_VERSION" ]; then
            exit 0
          fi

          rm -rf "${PGDATA}"
          mkdir -p "${PGDATA}"
          chown -R 1000:1000 "$(dirname "${PGDATA}")"
          chmod 0700 "${PGDATA}"

          until PGPASSWORD="{{ $var.postgresqlPassword }}" psql \
            -h writer \
            -U "{{ $var.postgresqlUsername }}" \
            -d postgres \
            -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'omnistrate_replication'" | grep -q 1
          do
            sleep 5
          done

          SLOT_READY=0
          export PGPASSWORD="{{ $var.postgresqlPassword }}"
          for _ in $(seq 1 60); do
            SLOT_ACTIVE="$(psql \
              -h writer \
              -U "{{ $var.postgresqlUsername }}" \
              -d postgres \
              -tAc "SELECT active::int FROM pg_replication_slots WHERE slot_name = '${SLOT_NAME}'")"

            if [ -z "${SLOT_ACTIVE}" ]; then
              psql -v ON_ERROR_STOP=1 -h writer -U "{{ $var.postgresqlUsername }}" -d postgres <<SQL
          SELECT format(
            'SELECT pg_create_physical_replication_slot(%L)',
            '${SLOT_NAME}'
          )
          WHERE NOT EXISTS (
            SELECT 1 FROM pg_replication_slots WHERE slot_name = '${SLOT_NAME}'
          ) \gexec
          SQL
              SLOT_READY=1
              break
            fi

            if [ "${SLOT_ACTIVE}" = "0" ]; then
              SLOT_READY=1
              break
            fi

            sleep 5
          done
          unset PGPASSWORD

          if [ "${SLOT_READY}" != "1" ]; then
            echo "Replication slot ${SLOT_NAME} remained active during replica bootstrap"
            exit 1
          fi

          export PGPASSWORD="{{ $sys.deterministicSeedValue }}"
          pg_basebackup \
            --host=writer \
            --port=5432 \
            --username=omnistrate_replication \
            --pgdata="${PGDATA}" \
            --checkpoint=fast \
            --wal-method=stream \
            --slot="${SLOT_NAME}"
          unset PGPASSWORD

          touch "${PGDATA}/standby.signal"
          cat >> "${PGDATA}/postgresql.auto.conf" <<EOF
          primary_conninfo = 'host=writer port=5432 user=omnistrate_replication password={{ $sys.deterministicSeedValue }} application_name={{ $sys.compute.node.name }}'
          primary_slot_name = '${SLOT_NAME}'
          EOF

          chown -R 1000:1000 "${PGDATA}"
          chmod 0700 "${PGDATA}"
      - image: postgres:16-bookworm
        scope: NODE
        type: ADD
        command:
          - /bin/bash
          - -ec
        commandTemplate: |
          #!/bin/bash
          set -euo pipefail

          SLOT_NAME="reader_$((NODE_INDEX + 1))"
          export PGPASSWORD="{{ $var.postgresqlPassword }}"

          psql -v ON_ERROR_STOP=1 -h writer -U "{{ $var.postgresqlUsername }}" -d postgres <<SQL
          SELECT format(
            'SELECT pg_create_physical_replication_slot(%L)',
            '${SLOT_NAME}'
          )
          WHERE NOT EXISTS (
            SELECT 1 FROM pg_replication_slots WHERE slot_name = '${SLOT_NAME}'
          ) \gexec
          SQL

          until psql \
            -h writer \
            -U "{{ $var.postgresqlUsername }}" \
            -d postgres \
            -tAc "SELECT 1 FROM pg_stat_replication WHERE application_name = '{{ $sys.compute.node.name }}'" | grep -q 1
          do
            sleep 5
          done
      - image: postgres:16-bookworm
        scope: NODE
        type: REMOVE
        command:
          - /bin/bash
          - -ec
        commandTemplate: |
          #!/bin/bash
          set -euo pipefail

          SLOT_NAME="reader_$((NODE_INDEX + 1))"
          export PGPASSWORD="{{ $var.postgresqlPassword }}"

          for _ in $(seq 1 30); do
            ACTIVE="$(psql -h writer -U "{{ $var.postgresqlUsername }}" -d postgres -tAc "SELECT active::int FROM pg_replication_slots WHERE slot_name = '${SLOT_NAME}'")"

            if [ -z "${ACTIVE}" ]; then
              exit 0
            fi

            if [ "${ACTIVE}" = "0" ]; then
              psql -v ON_ERROR_STOP=1 -h writer -U "{{ $var.postgresqlUsername }}" -d postgres -c "SELECT pg_drop_replication_slot('${SLOT_NAME}');"
              exit 0
            fi

            sleep 5
          done

          echo "Replication slot ${SLOT_NAME} remained active during node removal"
          exit 1
    x-omnistrate-api-params:
      - key: postgresqlPassword
        description: Default DB Password
        name: Password
        type: Password
        modifiable: false
        required: true
        export: true
      - key: postgresqlUsername
        description: Username
        name: Default DB Username
        type: String
        modifiable: false
        required: true
        export: true
      - key: numReplicas
        description: Number of Read Replicas
        name: Number of Read Replicas
        type: Float64
        modifiable: true
        required: true
        export: true
    x-omnistrate-mode-internal: true

  Cluster:
    image: omnistrate/noop
    x-omnistrate-api-params:
      - key: postgresqlPassword
        description: Default DB Password
        name: Password
        type: Password
        modifiable: false
        required: true
        export: true
        parameterDependencyMap:
          Writer: postgresqlPassword
          Reader: postgresqlPassword
      - key: postgresqlUsername
        description: Username
        name: Default DB Username
        type: String
        modifiable: false
        required: false
        export: true
        defaultValue: "postgres"
        parameterDependencyMap:
          Writer: postgresqlUsername
          Reader: postgresqlUsername
      - key: dbName
        description: Default Database Name
        name: Default Database
        type: String
        modifiable: false
        required: false
        export: true
        defaultValue: "db"
        parameterDependencyMap:
          Writer: postgresqlDatabase
      - key: numReplicas
        description: Number of Read Replicas
        name: Number of Read Replicas
        type: Float64
        modifiable: true
        required: false
        export: true
        defaultValue: "0"
        parameterDependencyMap:
          Reader: numReplicas
    depends_on:
      - Writer
      - Reader
    x-omnistrate-mode-internal: false
