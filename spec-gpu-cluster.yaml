# yaml-language-server: $schema=https://api.omnistrate.cloud/2022-09-01-00/schema/service-spec-schema.json
name: Nebius vLLM GPU Inference
deployment:
  hostedDeployment:
    NebiusTenantId: "tenant-e00ezh17k22wmwq5f0"

features:
  CUSTOMER:
    metrics:
      scrapeTargets:
        - name: vllm
          podSelector:
            app.kubernetes.io/name: vllm
            app.kubernetes.io/instance: vllm
          endpoint:
            portNumber: 8000
            path: /metrics
            scheme: http
        - name: dcgm-exporter
          podSelector:
            app.kubernetes.io/name: dcgm-exporter
            app.kubernetes.io/instance: vllm
            app.kubernetes.io/component: gpu-metrics
          endpoint:
            portNumber: 9400
            path: /metrics
            scheme: http
      additionalMetrics:
        vllm:
          metrics:
            "vllm:num_requests_running":
              "Running Requests":
                aggregationFunction: max
            "vllm:num_requests_waiting":
              "Waiting Requests":
                aggregationFunction: max
            "vllm:request_success_total":
              "Finished Requests":
                aggregationFunction: sum
                groupByLabels:
                  - finished_reason
            "DCGM_FI_DEV_GPU_UTIL":
              "GPU Utilization":
                aggregationFunction: max
                groupByLabels:
                  - Hostname
                  - modelName
                  - gpu
                  - UUID
            "DCGM_FI_DEV_MEM_COPY_UTIL":
              "GPU Memory Copy Utilization":
                aggregationFunction: max
                groupByLabels:
                  - Hostname
                  - modelName
                  - gpu
                  - UUID
            "DCGM_FI_DEV_FB_USED":
              "GPU Framebuffer Used":
                aggregationFunction: max
                groupByLabels:
                  - Hostname
                  - modelName
                  - gpu
                  - UUID
            "DCGM_FI_DEV_FB_FREE":
              "GPU Framebuffer Free":
                aggregationFunction: max
                groupByLabels:
                  - Hostname
                  - modelName
                  - gpu
                  - UUID
            "DCGM_FI_DEV_POWER_USAGE":
              "GPU Power Draw":
                aggregationFunction: max
                groupByLabels:
                  - Hostname
                  - modelName
                  - gpu
                  - UUID
            "DCGM_FI_DEV_GPU_TEMP":
              "GPU Temperature":
                aggregationFunction: max
                groupByLabels:
                  - Hostname
                  - modelName
                  - gpu
                  - UUID
            "DCGM_FI_DEV_SM_CLOCK":
              "GPU SM Clock":
                aggregationFunction: max
                groupByLabels:
                  - Hostname
                  - modelName
                  - gpu
                  - UUID
            "DCGM_FI_DEV_MEM_CLOCK":
              "GPU Memory Clock":
                aggregationFunction: max
                groupByLabels:
                  - Hostname
                  - modelName
                  - gpu
                  - UUID
            "DCGM_FI_PROF_PCIE_TX_BYTES":
              "GPU PCIe TX Throughput":
                aggregationFunction: max
                groupByLabels:
                  - Hostname
                  - modelName
                  - gpu
                  - UUID
            "DCGM_FI_PROF_PCIE_RX_BYTES":
              "GPU PCIe RX Throughput":
                aggregationFunction: max
                groupByLabels:
                  - Hostname
                  - modelName
                  - gpu
                  - UUID
            "DCGM_FI_DEV_XID_ERRORS":
              "GPU Last XID Error":
                aggregationFunction: max
                groupByLabels:
                  - Hostname
                  - modelName
                  - gpu
                  - UUID
          dashboards:
            serving:
              title: "vLLM Serving"
              sections:
                - title: "Traffic"
                  panels:
                    - title: "Request States"
                      type: timeseries
                      unit: short
                      targets:
                        - ref: "Running Requests"
                          legend: "Running"
                        - ref: "Waiting Requests"
                          legend: "Waiting"
                    - title: "Finished Requests / s"
                      type: timeseries
                      unit: short
                      targets:
                        - expr: "sum(rate(vllm:request_success_total[5m]))"
                          legend: "Requests / s"
                    - title: "Token Throughput"
                      type: timeseries
                      unit: short
                      targets:
                        - expr: "sum(rate(vllm:prompt_tokens_total[5m]))"
                          legend: "Prompt tok/s"
                        - expr: "sum(rate(vllm:generation_tokens_total[5m]))"
                          legend: "Generation tok/s"
                    - title: "Finished Requests by Reason"
                      type: table
                      targets:
                        - ref: "Finished Requests"
                - title: "Latency"
                  panels:
                    - title: "Avg TTFT (5m)"
                      type: stat
                      unit: s
                      targets:
                        - expr: "sum(rate(vllm:time_to_first_token_seconds_sum[5m])) / clamp_min(sum(rate(vllm:time_to_first_token_seconds_count[5m])), 1)"
                    - title: "P90 TTFT (5m)"
                      type: stat
                      unit: s
                      targets:
                        - expr: "histogram_quantile(0.90, sum by (le) (rate(vllm:time_to_first_token_seconds_bucket[5m])))"
                    - title: "Avg TPOT (5m)"
                      type: stat
                      unit: s
                      targets:
                        - expr: "sum(rate(vllm:inter_token_latency_seconds_sum[5m])) / clamp_min(sum(rate(vllm:inter_token_latency_seconds_count[5m])), 1)"
                    - title: "P90 E2E Latency (5m)"
                      type: stat
                      unit: s
                      targets:
                        - expr: "histogram_quantile(0.90, sum by (le) (rate(vllm:e2e_request_latency_seconds_bucket[5m])))"
                    - title: "Avg Queue Time (5m)"
                      type: stat
                      unit: s
                      targets:
                        - expr: "sum(rate(vllm:request_queue_time_seconds_sum[5m])) / clamp_min(sum(rate(vllm:request_queue_time_seconds_count[5m])), 1)"
                    - title: "Prefill vs Decode (5m)"
                      type: timeseries
                      unit: s
                      targets:
                        - expr: "sum(rate(vllm:request_prefill_time_seconds_sum[5m])) / clamp_min(sum(rate(vllm:request_prefill_time_seconds_count[5m])), 1)"
                          legend: "Prefill"
                        - expr: "sum(rate(vllm:request_decode_time_seconds_sum[5m])) / clamp_min(sum(rate(vllm:request_decode_time_seconds_count[5m])), 1)"
                          legend: "Decode"
                - title: "Cache"
                  panels:
                    - title: "KV Cache Usage"
                      type: gauge
                      unit: "%"
                      min: 0
                      max: 100
                      targets:
                        - expr: "100 * avg(vllm:kv_cache_usage_perc)"
                      thresholds:
                        - color: green
                          value: 0
                        - color: yellow
                          value: 70
                        - color: red
                          value: 90
                    - title: "Prefix Cache Hit Rate (5m)"
                      type: gauge
                      unit: "%"
                      min: 0
                      max: 100
                      targets:
                        - expr: "100 * (sum(rate(vllm:prefix_cache_hits[5m])) / clamp_min(sum(rate(vllm:prefix_cache_queries[5m])), 1))"
                    - title: "Prefix Cache Queries vs Hits / s"
                      type: timeseries
                      unit: short
                      targets:
                        - expr: "sum(rate(vllm:prefix_cache_queries[5m]))"
                          legend: "Queries / s"
                        - expr: "sum(rate(vllm:prefix_cache_hits[5m]))"
                          legend: "Hits / s"
                    - title: "Tokens Per Request (5m)"
                      type: timeseries
                      unit: short
                      targets:
                        - expr: "sum(rate(vllm:prompt_tokens_total[5m])) / clamp_min(sum(rate(vllm:request_success_total[5m])), 1)"
                          legend: "Prompt / request"
                        - expr: "sum(rate(vllm:generation_tokens_total[5m])) / clamp_min(sum(rate(vllm:request_success_total[5m])), 1)"
                          legend: "Generation / request"
            gpu:
              title: "NVIDIA GPU"
              sections:
                - title: "Inventory"
                  panels:
                    - title: "GPU Count"
                      type: stat
                      unit: short
                      targets:
                        - expr: "count(count by (UUID) (DCGM_FI_DEV_GPU_UTIL))"
                    - title: "GPU Inventory"
                      type: table
                      unit: bytes
                      targets:
                        - expr: "1048576 * max by (Hostname, modelName, UUID, gpu, device, namespace, pod, container, DCGM_FI_DRIVER_VERSION) (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE)"
                          legend: "Framebuffer Capacity"
                - title: "Utilization"
                  panels:
                    - title: "GPU Utilization"
                      type: timeseries
                      unit: "%"
                      targets:
                        - ref: "GPU Utilization"
                    - title: "Memory Copy Utilization"
                      type: timeseries
                      unit: "%"
                      targets:
                        - ref: "GPU Memory Copy Utilization"
                    - title: "Tensor / DRAM Activity"
                      type: timeseries
                      unit: "%"
                      targets:
                        - expr: "100 * avg by (Hostname, modelName, gpu, UUID) (DCGM_FI_PROF_PIPE_TENSOR_ACTIVE)"
                          legend: "Tensor"
                        - expr: "100 * avg by (Hostname, modelName, gpu, UUID) (DCGM_FI_PROF_DRAM_ACTIVE)"
                          legend: "DRAM"
                - title: "Memory and IO"
                  panels:
                    - title: "Framebuffer Used"
                      type: timeseries
                      unit: bytes
                      targets:
                        - expr: "1048576 * max by (Hostname, modelName, gpu, UUID) (DCGM_FI_DEV_FB_USED)"
                    - title: "Framebuffer Usage %"
                      type: gauge
                      unit: "%"
                      min: 0
                      max: 100
                      targets:
                        - expr: "100 * avg(DCGM_FI_DEV_FB_USED / clamp_min(DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE, 1))"
                      thresholds:
                        - color: green
                          value: 0
                        - color: yellow
                          value: 70
                        - color: red
                          value: 90
                    - title: "PCIe Throughput"
                      type: timeseries
                      unit: bytes
                      targets:
                        - ref: "GPU PCIe TX Throughput"
                          legend: "TX B/s"
                        - ref: "GPU PCIe RX Throughput"
                          legend: "RX B/s"
                - title: "Thermals and Health"
                  panels:
                    - title: "Power Draw"
                      type: timeseries
                      unit: short
                      targets:
                        - ref: "GPU Power Draw"
                    - title: "Temperature"
                      type: timeseries
                      unit: short
                      targets:
                        - ref: "GPU Temperature"
                    - title: "Clocks"
                      type: timeseries
                      unit: short
                      targets:
                        - ref: "GPU SM Clock"
                          legend: "SM MHz"
                        - ref: "GPU Memory Clock"
                          legend: "MEM MHz"
                    - title: "Max XID Error"
                      type: stat
                      unit: short
                      thresholds:
                        - color: green
                          value: 0
                        - color: red
                          value: 1
                      targets:
                        - expr: "max(DCGM_FI_DEV_XID_ERRORS)"
                    - title: "PCIe Replay Errors / s"
                      type: timeseries
                      unit: short
                      targets:
                        - expr: "sum(rate(DCGM_FI_DEV_PCIE_REPLAY_COUNTER[5m]))"
                          legend: "Retries / s"

services:
  - name: vllm
    compute:
      rootVolumeSizeGi: 256
      instanceTypes:
        - name: 8gpu-128vcpu-1600gb
          cloudProvider: nebius
          platform: gpu-h200-sxm
          configurationOverrides:
            GpuClusterID: compute-cluster-id
    network:
      ports:
        - 8000
    endpointConfiguration:
      api:
        host: "$sys.network.externalClusterEndpoint"
        ports:
          - 8000
        primary: true
        networkingType: PUBLIC
    helmChartConfiguration:
      chartName: chart-vllm
      chartVersion: 0.0.5
      chartRepoName: omnistrate-vllm
      chartRepoURL: oci://ghcr.io/omnistrate/vllm
      chartValues:
        labels:
          app.kubernetes.io/name: vllm
          app.kubernetes.io/component: api
          app.kubernetes.io/instance: vllm
        replicaCount: 1
        serviceType: LoadBalancer
        containerPort: 8000
        servicePort: 8000
        serviceAnnotations:
          external-dns.alpha.kubernetes.io/hostname: $sys.network.externalClusterEndpoint
          external-dns.alpha.kubernetes.io/ttl: "60"
        gpuModels: []
        image:
          repository: vllm/vllm-openai
          tag: latest
          command:
            - vllm
            - serve
            - facebook/opt-13b
            - --served-model-name
            - opt-13b
            - --tensor-parallel-size
            - "8"
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --dtype
            - auto
          env:
            - name: HF_HOME
              value: /data/huggingface
            - name: HUGGINGFACE_HUB_CACHE
              value: /data/huggingface/hub
        resources:
          requests:
            cpu: 8
            memory: 64Gi
            nvidia.com/gpu: 8
          limits:
            cpu: 8
            memory: 64Gi
            nvidia.com/gpu: 8
        readinessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 60
          timeoutSeconds: 5
          httpGet:
            path: /health
            port: 8000
        livenessProbe:
          initialDelaySeconds: 900
          periodSeconds: 30
          failureThreshold: 10
          timeoutSeconds: 5
          httpGet:
            path: /health
            port: 8000
        customObjects:
          - apiVersion: apps/v1
            kind: DaemonSet
            metadata:
              name: vllm-dcgm-exporter
              labels:
                app.kubernetes.io/name: dcgm-exporter
                app.kubernetes.io/instance: vllm
                app.kubernetes.io/component: gpu-metrics
            spec:
              selector:
                matchLabels:
                  app.kubernetes.io/name: dcgm-exporter
                  app.kubernetes.io/instance: vllm
                  app.kubernetes.io/component: gpu-metrics
              updateStrategy:
                type: RollingUpdate
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: dcgm-exporter
                    app.kubernetes.io/instance: vllm
                    app.kubernetes.io/component: gpu-metrics
                spec:
                  automountServiceAccountToken: false
                  nodeSelector:
                    nebius.com/gpu: "true"
                    omnistrate.com/resource: $sys.deployment.resourceID
                  tolerations:
                    - operator: Exists
                      effect: NoSchedule
                  containers:
                    - name: dcgm-exporter
                      image: nvcr.io/nvidia/k8s/dcgm-exporter:4.5.2-4.8.1-distroless
                      imagePullPolicy: IfNotPresent
                      args:
                        - -f
                        - /etc/dcgm-exporter/default-counters.csv
                      env:
                        - name: DCGM_EXPORTER_KUBERNETES
                          value: "true"
                        - name: DCGM_EXPORTER_LISTEN
                          value: ":9400"
                        - name: NODE_NAME
                          valueFrom:
                            fieldRef:
                              fieldPath: spec.nodeName
                      ports:
                        - name: metrics
                          containerPort: 9400
                      readinessProbe:
                        httpGet:
                          path: /health
                          port: 9400
                        initialDelaySeconds: 15
                        periodSeconds: 15
                      livenessProbe:
                        httpGet:
                          path: /health
                          port: 9400
                        initialDelaySeconds: 60
                        periodSeconds: 30
                      securityContext:
                        runAsNonRoot: false
                        runAsUser: 0
                        allowPrivilegeEscalation: false
                        capabilities:
                          add:
                            - SYS_ADMIN
                          drop:
                            - ALL
                      resources:
                        requests:
                          cpu: 100m
                          memory: 128Mi
                        limits:
                          cpu: 200m
                          memory: 512Mi
                      volumeMounts:
                        - name: pod-gpu-resources
                          mountPath: /var/lib/kubelet/pod-resources
                          readOnly: true
                  volumes:
                    - name: pod-gpu-resources
                      hostPath:
                        path: /var/lib/kubelet/pod-resources
        extraInit:
          modelDownload:
            enabled: false
          pvcStorage: 279Gi
